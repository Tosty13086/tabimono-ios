workflows:
  tabimono-ios-testflight:
    name: たびもの手帳 - iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: yumechokin
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tabimonotecho.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tabimonotecho.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm install
        script: |
          npm ci
      - name: Capacitor sync (iOS)
        script: |
          npx cap sync ios
      - name: 証明書・プロビジョニングプロファイルを自動取得
        script: |
          xcode-project use-profiles
      - name: TestFlightの最新ビルド番号+1を設定
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
        working_directory: ios/App
      - name: ipaをビルド
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Betaレビュー(外部テスター用)に出さず、内部テスターへすぐ配信したい場合は
        # 下の2行を削除してください（デフォルトは内部テスターへの自動配信のみ）。
